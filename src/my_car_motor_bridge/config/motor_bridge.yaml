motor_bridge_node:
  ros__parameters:
    # Startup-only settings; restart the node to change modes.
    serial_mode: "control"
    legacy_fallback_enabled: true
    legacy_fallback_timeout_sec: 1.0
    port: "/dev/ttyACM0"
    baudrate: 115200
    send_rate_hz: 50.0
    read_rate_hz: 100.0
    cmd_timeout_sec: 0.3
    enable_on_start: true
    send_zero_when_timeout: true

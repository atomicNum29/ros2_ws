<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my_car_web_monitor</title>
    <link rel="stylesheet" href="/static/motor-status.css" />
    <style>
      :root { color-scheme: light; --bg:#f5f7f8; --panel:#f5f7f8; --panel-2:#eef2f4;
        --text:#1d2b39; --muted:#566779; --line:#d7e0e7; --accent:#137755; --danger:#bc303b; --warn:#946000; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans KR",sans-serif; }
      main { margin:auto; padding:0 12px 12px; }
      h1,h2,p { margin:0; } h1 { font-size:1.1rem; } h2 { font-size:1rem; }
      header,.panel-head,.row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      header.status-bar { min-height:38px; padding:5px 0; margin-bottom:8px; border-bottom:1px solid var(--line); justify-content:flex-start; gap:16px; flex-wrap:wrap; font-size:.75rem; }
      .status-bar h1 { font-size:.85rem; white-space:nowrap; }
      .status-bar #health { margin-left:auto; }
      #vehicle-summary { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
      #vehicle-summary .motor-summary { display:flex; flex-wrap:wrap; gap:12px; margin:0; }
      #vehicle-summary .motor-summary-item { display:flex; align-items:baseline; gap:5px; padding:0; }
      #vehicle-summary .motor-summary-item strong { font-size:.78rem; }
      #vehicle-summary .motor-summary-item > small, #vehicle-summary .motor-summary-item span small { display:none; }
      #vehicle-summary [data-tone="ok"] { color:var(--accent); }
      #vehicle-summary [data-tone="warn"], #driving-warnings [data-tone="warn"] { color:var(--warn); }
      #vehicle-summary [data-tone="bad"], #driving-warnings [data-tone="bad"] { color:var(--danger); }
      #vehicle-summary [data-tone="neutral"] { color:var(--muted); }
      #vehicle-summary .status-badge { border:0; padding:0; border-radius:0; font-size:.75rem; }
      #driving-warnings:empty { display:none; }
      #driving-warnings .driving-alert { margin:0 0 8px; padding:4px 0; border-radius:0; background:transparent; } .row { justify-content:flex-start; flex-wrap:wrap; gap:8px; }
      .muted { color:var(--muted); } .ok { color:var(--accent); } .bad { color:var(--danger); } .warn { color:var(--warn); }
      .panel { min-width:0; padding:0; border:0; border-radius:0; background:transparent; }
      .panel-head { margin-bottom:6px; } .layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:start; }
      button { min-height:30px; padding:4px 9px; border:1px solid var(--line); border-radius:3px; background:var(--panel); color:var(--text); font:inherit; font-size:.85rem; font-weight:650; cursor:pointer; }
      button:hover { background:#e8eef2; } button:focus-visible,summary:focus-visible,input:focus-visible { outline:3px solid #257ab4; outline-offset:3px; }
      button.primary { background:var(--accent); border-color:var(--accent); color:white; } button.danger { background:var(--danger); border-color:var(--danger); color:white; }
      summary { cursor:pointer; color:var(--muted); font-size:.85rem; padding:5px 0; }
      .stream-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .stream-card { min-width:0; border:0; border-radius:0; background:transparent; }
      .stream-video { position:relative; aspect-ratio:4/3; max-height:58vh; background:#0b1016; line-height:0; }
      video { display:block; width:100%; height:100%; object-fit:contain; background:#0b1016; }
      .stream-info { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:4px 0; font-size:.8rem; }
      .stream-title { margin-right:auto; }
      .stream-connection { display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:.73rem; color:var(--muted); }
      .stream-connection > span + span::before { content:"·"; color:var(--muted); margin-right:5px; }
      .stream-actions { display:flex; gap:4px; }
      .stream-actions button { min-height:24px; padding:2px 6px; font-size:.72rem; }
      .status-list { font-size:.78rem; color:var(--muted); display:grid; gap:5px; overflow-wrap:anywhere; }
      .card-error:not(:empty),#stream-error:not(:empty) { padding:9px 10px; background:#fff0f0; font-size:.83rem; }
      .lidar-panel { display:flex; flex-direction:column; }
      .lidar-placeholder { min-height:160px; display:grid; place-content:center; text-align:center; gap:8px; padding:12px 0; color:var(--muted); }
      .lidar-placeholder strong { font-size:1rem; color:var(--text); } .lidar-placeholder p { max-width:240px; font-size:.85rem; line-height:1.7; }
      .view-note { margin-top:10px; font-size:.75rem; color:var(--muted); }
      .control-panel { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); display:grid; grid-template-columns:auto minmax(260px,1fr) auto; align-items:center; gap:8px 16px; }
      #control-state { font-size:.8rem; }
      .speed-controls { display:flex; flex-wrap:wrap; gap:8px 16px; }
      .speed-control { display:grid; grid-template-columns:1fr auto; flex:1; min-width:160px; gap:5px 12px; font-size:.8rem; }
      .speed-control input { grid-column:1/-1; width:100%; accent-color:var(--accent); } .speed-value { font-variant-numeric:tabular-nums; }
      .driving-actions { display:flex; align-items:center; gap:12px; } #stop-control { min-width:110px; min-height:44px; font-size:1.05rem; }
      .teleop-grid { display:grid; grid-template-columns:repeat(3,38px); gap:4px; } .teleop-grid button { padding:0; min-height:30px; }
      .control-details { grid-column:1/-1; border-top:1px solid var(--line); }
      #control-error:not(:empty) { grid-column:1/-1; } .keyboard-note { font-size:.75rem; color:var(--muted); }
      @media(max-width:1000px) { .control-panel { grid-template-columns:1fr 2fr; } .driving-actions { grid-column:1/-1; justify-content:space-between; } }
      @media(max-width:680px) { .layout { grid-template-columns:1fr; } .control-panel { grid-template-columns:1fr; } .stream-grid { grid-template-columns:1fr; } header { flex-wrap:wrap; } .lidar-placeholder { min-height:120px; } }
    </style>
  </head>
  <body>
    <main>
      <header class="status-bar" aria-label="주행 상태">
        <h1>원격 주행</h1>
        <div id="vehicle-summary" aria-label="차량 요약"></div>
        <div class="row" aria-label="주행 제어 연결">
          <span id="control-state" class="muted" role="status">제어: idle</span>
          <button id="connect-control" class="primary">제어 연결</button>
          <button id="disconnect-control">연결 해제</button>
        </div>
        <div id="health" class="muted" role="status">서버 확인 중</div>
      </header>
      <div id="driving-warnings"></div>
      <div class="layout">
        <section class="panel" aria-label="주행 카메라">
          <div class="panel-head"><h2>카메라</h2><div class="row">
            <button id="start-all" class="primary">영상 연결</button><button id="stop-all">영상 끊기</button>
          </div></div>
          <div id="stream-grid" class="stream-grid"></div>
          <p id="stream-error" class="bad" role="status"></p>
        </section>
        <section class="panel lidar-panel" aria-label="주변 라이다">
          <div class="panel-head"><h2>주변 공간</h2><span class="muted">라이다 · 미연결</span></div>
          <div class="lidar-placeholder"><strong>라이다 연결 예정</strong><p>차량 주변 장애물을 표시할 영역입니다. 현재는 스캔 데이터를 수신하지 않습니다.</p></div>
          <p class="view-note">카메라 밖 장애물과 주변 간격 확인용</p>
        </section>
      </div>
      <section class="panel control-panel" aria-label="주행 제어">
        <h2>주행 제어</h2>
        <div class="speed-controls">
          <label class="speed-control" for="linear-speed"><span>직진 속도</span><output id="linear-speed-value" class="speed-value">0.30 m/s</output><input id="linear-speed" type="range" min="0" max="1" step="0.05" value="0.3" /></label>
          <label class="speed-control" for="angular-speed"><span>회전 속도</span><output id="angular-speed-value" class="speed-value">1.00 rad/s</output><input id="angular-speed" type="range" min="0" max="3" step="0.1" value="1" /></label>
        </div>
        <div class="driving-actions"><div><div class="teleop-grid">
          <span></span><button data-command="forward" aria-label="전진 (W)">W</button><span></span>
          <button data-command="left" aria-label="좌회전 (A)">A</button><button data-command="backward" aria-label="후진 (S)">S</button><button data-command="right" aria-label="우회전 (D)">D</button>
        </div><span class="keyboard-note">WASD / 방향키</span></div><button id="stop-control" class="danger">정지</button></div>
        <div id="control-error" class="bad" role="status"></div>
        <details class="control-details"><summary>제어 통신 상세</summary><div class="status-list"><div id="cmd-status">cmd: linear=0.00 angular=0.00</div><div id="topic-status">topic: loading</div></div></details>
      </section>
      <section id="motor-dashboard" class="panel motor-dashboard" lang="ko" aria-label="차량 및 모터 상태"></section>
    </main>
    <template id="stream-template">
      <article class="stream-card">
        <div class="stream-video"><video autoplay playsinline muted></video></div>
        <div class="stream-info">
          <strong class="stream-title"></strong>
          <div class="stream-connection" role="status" aria-label="영상 연결 상태">
            <span class="connection-status">미연결</span><span class="ice-status">ICE 대기</span><span class="stream-status">영상 대기</span>
          </div>
          <div class="stream-actions"><button class="start-stream primary">연결</button><button class="stop-stream">끊기</button></div>
        </div>
        <div class="card-error bad" role="status"></div>
      </article>
    </template>

    <script src="/static/motor-status.js"></script>
    <script>
      const streamGrid = document.getElementById("stream-grid");
      const streamTemplate = document.getElementById("stream-template");
      const streamError = document.getElementById("stream-error");
      const health = document.getElementById("health");
      const startAllButton = document.getElementById("start-all");
      const stopAllButton = document.getElementById("stop-all");
      const connectControlButton = document.getElementById("connect-control");
      const disconnectControlButton = document.getElementById("disconnect-control");
      const stopControlButton = document.getElementById("stop-control");
      const linearSpeedInput = document.getElementById("linear-speed");
      const angularSpeedInput = document.getElementById("angular-speed");
      const linearSpeedValue = document.getElementById("linear-speed-value");
      const angularSpeedValue = document.getElementById("angular-speed-value");
      const controlState = document.getElementById("control-state");
      const cmdStatus = document.getElementById("cmd-status");
      const topicStatus = document.getElementById("topic-status");
      const stopStatusMonitor = MotorStatusUI.start(document.getElementById("motor-dashboard"));
      const controlError = document.getElementById("control-error");

      const streamCards = new Map();
      const activeKeys = new Set();
      const teleopState = { linearSpeed: 0.3, angularSpeed: 1.0 };
      let controlSocket = null;
      let controlTimer = null;

      function setText(element, prefix, value, bad = false) {
        const labels = {
          idle:"대기", new:"대기", checking:"확인 중", connecting:"연결 중",
          connected:"연결됨", completed:"연결됨", disconnected:"끊김",
          failed:"실패", closed:"종료", interrupted:"중단", streaming:"수신 중", error:"오류",
        };
        if (prefix === "connection") element.textContent = value === "idle" ? "미연결" : (labels[value] || value);
        else if (prefix === "ice") element.textContent = `ICE ${labels[value] || value}`;
        else if (prefix === "state") element.textContent = `영상 ${labels[value] || value}`;
        else element.textContent = `${prefix}: ${value}`;
        element.classList.toggle("bad", bad);
        element.classList.toggle("ok", !bad && value !== "idle" && value !== "waiting");
      }

      function controlVector() {
        let linear = 0;
        let angular = 0;
        if (activeKeys.has("forward")) linear += teleopState.linearSpeed;
        if (activeKeys.has("backward")) linear -= teleopState.linearSpeed;
        if (activeKeys.has("left")) angular += teleopState.angularSpeed;
        if (activeKeys.has("right")) angular -= teleopState.angularSpeed;
        return { linear, angular };
      }

      function sendControlMessage(message) {
        if (!controlSocket || controlSocket.readyState !== WebSocket.OPEN) return;
        controlSocket.send(JSON.stringify(message));
      }

      function sendCurrentCommand() {
        const { linear, angular } = controlVector();
        cmdStatus.textContent = `cmd: linear=${linear.toFixed(2)} angular=${angular.toFixed(2)}`;
        sendControlMessage({ type: "command", linear, angular });
      }

      function startControlLoop() {
        stopControlLoop();
        controlTimer = window.setInterval(sendCurrentCommand, 100);
      }

      function stopControlLoop() {
        if (controlTimer) {
          window.clearInterval(controlTimer);
          controlTimer = null;
        }
      }

      async function connectControl() {
        if (controlSocket) return;
        controlError.textContent = "";
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        controlSocket = new WebSocket(`${protocol}://${window.location.host}/ws/control`);
        controlSocket.addEventListener("open", () => {
          setText(controlState, "control", "connected");
          startControlLoop();
          sendControlMessage({ type: "status" });
        });
        controlSocket.addEventListener("message", (event) => {
          const payload = JSON.parse(event.data);
          if (payload.type === "error") {
            controlError.textContent = payload.message;
            return;
          }
          if (payload.type === "status") {
            topicStatus.textContent = `topic: ${payload.cmd_vel_topic}`;
          }
        });
        controlSocket.addEventListener("close", () => {
          activeKeys.clear();
          stopControlLoop();
          controlSocket = null;
          setText(controlState, "control", "idle");
          cmdStatus.textContent = "cmd: linear=0.00 angular=0.00";
        });
        controlSocket.addEventListener("error", () => {
          setText(controlState, "control", "error", true);
        });
      }

      function disconnectControl() {
        activeKeys.clear();
        stopControlLoop();
        sendControlMessage({ type: "stop" });
        if (controlSocket) controlSocket.close();
        controlSocket = null;
        cmdStatus.textContent = "cmd: linear=0.00 angular=0.00";
      }

      function setCommandActive(command, active) {
        if (active) activeKeys.add(command);
        else activeKeys.delete(command);
        sendCurrentCommand();
      }

      function createStreamCard(stream) {
        const fragment = streamTemplate.content.cloneNode(true);
        const video = fragment.querySelector("video");
        const title = fragment.querySelector(".stream-title");
        const startButton = fragment.querySelector(".start-stream");
        const stopButton = fragment.querySelector(".stop-stream");
        const connectionStatus = fragment.querySelector(".connection-status");
        const iceStatus = fragment.querySelector(".ice-status");
        const streamStatus = fragment.querySelector(".stream-status");
        const cardError = fragment.querySelector(".card-error");

        title.textContent = stream.id;

        const card = {
          stream,
          video,
          connectionStatus,
          iceStatus,
          streamStatus,
          cardError,
          peerConnection: null,
          frameWatchdog: null,
          lastVideoTime: 0,
          lastFrameAt: 0,
          lastFramesDecoded: 0,
        };

        startButton.addEventListener("click", () => startStream(card));
        stopButton.addEventListener("click", () => stopStream(card));
        streamCards.set(stream.id, card);
        streamGrid.appendChild(fragment);
      }

      async function loadStreams() {
        const response = await fetch("/streams");
        if (!response.ok) throw new Error(`stream discovery failed: ${response.status}`);
        const payload = await response.json();
        streamGrid.innerHTML = "";
        streamCards.clear();
        for (const stream of payload.streams || []) createStreamCard(stream);
      }

      async function loadControlConfig() {
        const response = await fetch("/control/config");
        if (!response.ok) throw new Error(`control config failed: ${response.status}`);
        const payload = await response.json();
        linearSpeedInput.max = payload.linear_speed;
        linearSpeedInput.value = payload.linear_speed;
        angularSpeedInput.max = payload.angular_speed;
        angularSpeedInput.value = payload.angular_speed;
        updateSpeedSettings();
      }

      function updateSpeedSettings() {
        teleopState.linearSpeed = Number(linearSpeedInput.value);
        teleopState.angularSpeed = Number(angularSpeedInput.value);
        linearSpeedValue.textContent = `${teleopState.linearSpeed.toFixed(2)} m/s`;
        angularSpeedValue.textContent = `${teleopState.angularSpeed.toFixed(2)} rad/s`;
        if (activeKeys.size) sendCurrentCommand();
      }

      async function startStream(card) {
        if (card.peerConnection) return;
        card.cardError.textContent = "";
        card.lastVideoTime = 0;
        card.lastFrameAt = 0;
        card.lastFramesDecoded = 0;
        card.peerConnection = new RTCPeerConnection();
        card.peerConnection.addTransceiver("video", { direction: "recvonly" });
        card.peerConnection.ontrack = (event) => {
          card.video.srcObject = event.streams[0];
          card.lastVideoTime = card.video.currentTime;
          card.lastFrameAt = performance.now();
          event.track.onended = () => markStreamInterrupted(card, "video track ended");
          event.track.onmute = () => markStreamInterrupted(card, "video track muted");
        };
        card.peerConnection.onconnectionstatechange = () => {
          if (!card.peerConnection) return;
          const state = card.peerConnection.connectionState;
          setText(card.connectionStatus, "connection", state);
          if (["failed", "disconnected", "closed"].includes(state)) {
            markStreamInterrupted(card, `connection ${state}`);
          }
        };
        card.peerConnection.oniceconnectionstatechange = () => {
          if (!card.peerConnection) return;
          setText(card.iceStatus, "ice", card.peerConnection.iceConnectionState);
        };

        try {
          const offer = await card.peerConnection.createOffer();
          await card.peerConnection.setLocalDescription(offer);
          const response = await fetch("/offer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              stream_id: card.stream.id,
              sdp: card.peerConnection.localDescription.sdp,
              type: card.peerConnection.localDescription.type,
            }),
          });
          if (!response.ok) throw new Error(`offer failed: ${response.status}`);
          await card.peerConnection.setRemoteDescription(await response.json());
          setText(card.streamStatus, "state", "connecting");
          card.frameWatchdog = window.setInterval(() => void checkVideoProgress(card), 1000);
        } catch (error) {
          card.cardError.textContent = error.message;
          await stopStream(card);
        }
      }

      async function stopStream(card) {
        if (card.frameWatchdog) {
          window.clearInterval(card.frameWatchdog);
          card.frameWatchdog = null;
        }
        if (card.peerConnection) {
          card.peerConnection.getTransceivers().forEach((transceiver) => {
            if (transceiver.stop) transceiver.stop();
          });
          card.peerConnection.close();
          card.peerConnection = null;
        }
        card.video.srcObject = null;
        setText(card.connectionStatus, "connection", "idle");
        setText(card.iceStatus, "ice", "idle");
        setText(card.streamStatus, "state", "idle");
      }

      function markStreamInterrupted(card, reason) {
        if (!card.peerConnection) return;
        setText(card.streamStatus, "state", "interrupted");
        card.cardError.textContent = reason;
      }

      async function checkVideoProgress(card) {
        if (!card.peerConnection || card.video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;

        const peerConnection = card.peerConnection;
        let inboundVideo;
        const stats = await peerConnection.getStats();
        if (card.peerConnection !== peerConnection) return;
        stats.forEach((report) => {
          if (report.type === "inbound-rtp" && report.kind === "video") inboundVideo = report;
        });

        const now = performance.now();
        const framesDecoded = inboundVideo?.framesDecoded || 0;
        const videoAdvanced = card.video.currentTime > card.lastVideoTime;
        const decodedAdvanced = framesDecoded > card.lastFramesDecoded;
        if (videoAdvanced || decodedAdvanced) {
          card.lastVideoTime = card.video.currentTime;
          card.lastFrameAt = now;
          card.cardError.textContent = "";
          setText(card.streamStatus, "state", "streaming");
        } else if (card.lastFrameAt && now - card.lastFrameAt > 2000) {
          markStreamInterrupted(card, "no video frames received for 2 seconds");
        }
        card.lastFramesDecoded = framesDecoded;
      }

      async function startAllStreams() {
        for (const card of streamCards.values()) await startStream(card);
      }

      async function stopAllStreams() {
        for (const card of streamCards.values()) await stopStream(card);
      }

      const keyBindings = new Map([
        ["w", "forward"],
        ["arrowup", "forward"],
        ["s", "backward"],
        ["arrowdown", "backward"],
        ["a", "left"],
        ["arrowleft", "left"],
        ["d", "right"],
        ["arrowright", "right"],
      ]);

      document.querySelectorAll("[data-command]").forEach((button) => {
        const command = button.dataset.command;
        button.addEventListener("pointerdown", () => setCommandActive(command, true));
        button.addEventListener("pointerup", () => setCommandActive(command, false));
        button.addEventListener("pointerleave", () => setCommandActive(command, false));
        button.addEventListener("pointercancel", () => setCommandActive(command, false));
      });

      window.addEventListener("keydown", (event) => {
        const command = keyBindings.get(event.key.toLowerCase());
        if (!command) return;
        event.preventDefault();
        setCommandActive(command, true);
      });
      window.addEventListener("keyup", (event) => {
        const command = keyBindings.get(event.key.toLowerCase());
        if (!command) return;
        event.preventDefault();
        setCommandActive(command, false);
      });
      window.addEventListener("blur", () => {
        activeKeys.clear();
        sendControlMessage({ type: "stop" });
        cmdStatus.textContent = "cmd: linear=0.00 angular=0.00";
      });
      window.addEventListener("beforeunload", () => {
        stopStatusMonitor();
        stopAllStreams();
        disconnectControl();
      });

      startAllButton.addEventListener("click", startAllStreams);
      stopAllButton.addEventListener("click", stopAllStreams);
      connectControlButton.addEventListener("click", connectControl);
      disconnectControlButton.addEventListener("click", disconnectControl);
      linearSpeedInput.addEventListener("input", updateSpeedSettings);
      angularSpeedInput.addEventListener("input", updateSpeedSettings);
      stopControlButton.addEventListener("click", () => {
        activeKeys.clear();
        sendControlMessage({ type: "stop" });
        cmdStatus.textContent = "cmd: linear=0.00 angular=0.00";
      });

      Promise.all([fetch("/health"), loadStreams(), loadControlConfig()])
        .then(() => {
          health.textContent = "서버 연결됨";
          health.classList.add("ok");
        })
        .catch((error) => {
          health.textContent = "서버 연결 오류";
          streamError.textContent = error.message;
        });
    </script>
  </body>
</html>
